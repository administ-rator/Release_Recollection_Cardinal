    - name: zmk-behavior-insomnia
      remote: badjeff
      revision: 0ce76ae
      path: modules/zmk-behavior-insomnia

    - name: zmk-helpers                       # ⑦ keymap 記述ヘルパーマクロ
      remote: urob
      revision: "7e0219e"
      path: modules/zmk-helpers

    - name: zmk-tri-state                     # ⑧ Swapper（スマート Cmd+Tab）
